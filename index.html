<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121110">
<meta name="description" content="نظام الحضور والانصراف لأساس العارض">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أساس العارض">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>بصمة أساس العارض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Cinzel:wght@500&display=swap">
<style>
/* Layout: one centered app column; employee and owner are two views of the same shell, gold used only for the logo, the ring and the primary action */
:root{
  --bg:#121110;--surface:#1b1a17;--surface2:#24221e;--line:#35312b;--fg:#f3efe7;--muted:#a59e92;
  --gold:#c9963a;--gold-ink:#1b1306;--gold-soft:rgba(201,150,58,.15);
  --ok:#62bd6e;--ok-bg:rgba(98,189,110,.16);--bad:#e5635c;--bad-bg:rgba(229,99,92,.17);
  --warn:#e6a63c;--warn-bg:rgba(230,166,60,.17);--half:#e57f3d;--half-bg:rgba(229,127,61,.18);
  --info:#6ea6e3;--info-bg:rgba(110,166,227,.16);--off:#5c574f;--scrim:rgba(0,0,0,.55);
  --f-display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-latin:"Cinzel","Times New Roman",serif;
  --r:16px;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f2ee;--surface:#ffffff;--surface2:#f0ede7;--line:#e1dcd2;--fg:#1d1a16;--muted:#6e665a;
  --gold:#a7751c;--gold-ink:#ffffff;--gold-soft:rgba(167,117,28,.11);
  --ok:#2f8a3d;--ok-bg:#e5f2e3;--bad:#c23c35;--bad-bg:#fbe7e5;--warn:#a96c0b;--warn-bg:#fbefd9;
  --half:#b9561a;--half-bg:#fbe5d6;--info:#2f6cae;--info-bg:#e3eefa;--off:#c9c3b8;--scrim:rgba(20,16,10,.35);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f2ee;--surface:#ffffff;--surface2:#f0ede7;--line:#e1dcd2;--fg:#1d1a16;--muted:#6e665a;
  --gold:#a7751c;--gold-ink:#ffffff;--gold-soft:rgba(167,117,28,.11);
  --ok:#2f8a3d;--ok-bg:#e5f2e3;--bad:#c23c35;--bad-bg:#fbe7e5;--warn:#a96c0b;--warn-bg:#fbefd9;
  --half:#b9561a;--half-bg:#fbe5d6;--info:#2f6cae;--info-bg:#e3eefa;--off:#c9c3b8;--scrim:rgba(20,16,10,.35);color-scheme:light}
:root[data-theme="dark"]{
  --bg:#121110;--surface:#1b1a17;--surface2:#24221e;--line:#35312b;--fg:#f3efe7;--muted:#a59e92;
  --gold:#c9963a;--gold-ink:#1b1306;--gold-soft:rgba(201,150,58,.15);
  --ok:#62bd6e;--ok-bg:rgba(98,189,110,.16);--bad:#e5635c;--bad-bg:rgba(229,99,92,.17);
  --warn:#e6a63c;--warn-bg:rgba(230,166,60,.17);--half:#e57f3d;--half-bg:rgba(229,127,61,.18);
  --info:#6ea6e3;--info-bg:rgba(110,166,227,.16);--off:#5c574f;--scrim:rgba(0,0,0,.55);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ic{flex-shrink:0;display:inline-block;vertical-align:middle}
.app{max-width:1080px;margin:0 auto}

/* splash */
.splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s ease,transform .6s ease}
.splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.splash svg{width:min(46vw,190px);height:auto}
.lp{fill:transparent;stroke:var(--gold);stroke-width:9;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards,fillin .5s ease 1.3s forwards}
.lp:nth-child(2){animation-delay:.15s,1.4s}.lp:nth-child(3){animation-delay:.3s,1.5s}.lp:nth-child(4){animation-delay:.45s,1.6s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill:var(--gold)}}
.wordmark{font-family:var(--f-latin);letter-spacing:.42em;font-size:clamp(15px,4vw,20px);direction:ltr;margin-inline-start:.42em;opacity:0;transform:translateY(8px);animation:rise .6s ease 1.6s forwards}
.splash .sub{color:var(--muted);font-size:13px;opacity:0;animation:rise .6s ease 1.85s forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:40px;height:auto;flex-shrink:0}
.brand b{font-family:var(--f-display);font-weight:600;font-size:18px;display:block;line-height:1.2}
.brand span{color:var(--muted);font-size:12px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px;position:relative}
.seg button{padding:7px 14px;border-radius:9px;font-size:13px;color:var(--muted);position:relative;z-index:1;transition:color .3s}
.seg button[aria-pressed="true"]{color:var(--gold-ink)}
.seg .pill{position:absolute;top:4px;bottom:4px;border-radius:9px;background:var(--gold);transition:all .4s cubic-bezier(.3,1.3,.5,1)}
.clockbar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:10px;margin-bottom:18px}
.clockbar .t{font-family:var(--f-display);font-size:26px;font-weight:500;letter-spacing:.02em}
.clockbar .d{color:var(--muted);font-size:13px;text-align:left}
.demo-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--gold-soft);color:var(--gold);margin-inline-start:8px}

/* view switch */
.view{animation:viewin .5s cubic-bezier(.2,.9,.3,1)}
@keyframes viewin{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12px}
.reveal{animation:up .55s cubic-bezier(.2,.9,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* employee hero */
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.who select{background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit;font-size:14px}
.greet{font-family:var(--f-display);font-size:22px;font-weight:500;margin:4px 0 2px}
.phase{display:flex;align-items:center;gap:8px;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

.band{position:relative;margin-top:30px}
.band .bar{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px}
.band .bar div{display:flex;align-items:center;justify-content:center;font-size:11px;transform-origin:right;animation:grow .9s cubic-bezier(.2,.9,.3,1) both}
.band .bar div:nth-child(2){animation-delay:.12s}.band .bar div:nth-child(3){animation-delay:.24s}
@keyframes grow{from{transform:scaleX(0)}}
.w1,.w2{background:var(--ok-bg);color:var(--ok)}.bk{background:var(--warn-bg);color:var(--warn)}
.band .now{position:absolute;top:-24px;bottom:0;width:2px;background:var(--gold);transform:translateX(50%);transition:right 1s ease}
.band .now span{position:absolute;top:0;right:50%;transform:translateX(50%);white-space:nowrap;font-size:11px;color:var(--gold);background:var(--surface);padding:0 4px}
.band .now::after{content:"";position:absolute;bottom:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--gold);animation:blink 1.4s infinite}
.band .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;position:relative;height:16px}
.band .ticks span{position:absolute;transform:translateX(50%)}

/* scanner */
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:6px}
.scan{position:relative;width:208px;height:208px;max-width:100%}
.scan svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.scan .track{fill:none;stroke:var(--line);stroke-width:3}
.scan .orbit{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-dasharray:22 78;transform-origin:center;animation:spin 3.2s linear infinite}
.scan .prog{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .2s linear,stroke .3s}
@keyframes spin{to{transform:rotate(360deg)}}
.scan .core{position:absolute;inset:22px;border-radius:50%;background:var(--surface2);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--gold)}
.scan .core img{width:100%;height:100%;object-fit:cover}
.scan .core .face{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06);opacity:.7}}
.scan .laser{position:absolute;inset:22px;border-radius:50%;overflow:hidden;pointer-events:none;opacity:0}
.scan .laser::before{content:"";position:absolute;left:0;right:0;height:3px;background:var(--gold);top:0;animation:sweep 1.1s ease-in-out infinite alternate}
@keyframes sweep{to{top:calc(100% - 3px)}}
.scan.busy .laser{opacity:1}
.scan.busy .orbit{animation-duration:1s}
.scan.ok .prog{stroke:var(--ok)}
.scan.ok .orbit{stroke:var(--ok)}
.scan .tick{position:absolute;inset:22px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;transform:scale(0);color:#fff}
.scan.ok .tick{animation:pop .55s cubic-bezier(.3,1.6,.5,1) forwards}
.scan .tick path{stroke-dasharray:30;stroke-dashoffset:30}
.scan.ok .tick path{animation:checkdraw .45s ease .3s forwards}
@keyframes pop{to{transform:scale(1)}}
@keyframes checkdraw{to{stroke-dashoffset:0}}
.scan.fail{animation:shake .5s ease}
.scan.fail .prog,.scan.fail .orbit{stroke:var(--bad)}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.hint{font-size:13px;color:var(--muted);min-height:21px;text-align:center}
.actions{display:flex;gap:10px;width:100%;max-width:380px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:12px;font-weight:500;font-size:14px;transition:transform .15s,background .3s,opacity .3s;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{border:1px solid var(--line);background:var(--surface2)}
.btn[disabled]{opacity:.45;cursor:default}
.fp{position:relative;overflow:hidden}
.fp .fill{position:absolute;inset:0;background:var(--gold-soft);transform:scaleX(0);transform-origin:right}
.fp.holding .fill{transition:transform 1.2s linear;transform:scaleX(1)}
.fp > *:not(.fill){position:relative}
.next-label{font-family:var(--f-display);font-size:13px;color:var(--gold)}

.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px;width:100%}
.slot{background:var(--surface2);border-radius:12px;padding:10px 6px;text-align:center;border:1px solid transparent;transition:all .4s}
.slot .l{font-size:11px;color:var(--muted)}
.slot .v{font-family:var(--f-display);font-size:14px;font-weight:500;margin-top:2px}
.slot .m{font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:3px;min-height:16px}
.slot.done{border-color:var(--ok);background:var(--ok-bg)}
.slot.done .v{color:var(--ok)}
.slot.late{border-color:var(--warn);background:var(--warn-bg)}
.slot.late .v{color:var(--warn)}
.slot.missed{border-color:var(--bad);background:var(--bad-bg)}
.slot.missed .v{color:var(--bad)}
.scan.locked .orbit{animation-play-state:paused;stroke:var(--muted)}
.scan.locked .core{color:var(--muted)}
.slot.next{border-color:var(--gold);border-style:dashed;animation:nextpulse 1.8s ease-in-out infinite}
@keyframes nextpulse{50%{border-color:transparent}}
.slot.flash{animation:flash .8s ease}
@keyframes flash{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.timer{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--surface2);border-radius:12px;padding:10px 14px;margin-top:8px}
.timer b{font-family:var(--f-display);font-size:18px;font-weight:500}

/* stats */
.tabs{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px;position:relative}
.tabs button{flex:1;padding:6px;border-radius:8px;font-size:13px;color:var(--muted);position:relative;z-index:1;transition:color .3s}
.tabs button[aria-pressed="true"]{color:var(--fg)}
.tabs .pill{position:absolute;top:3px;bottom:3px;border-radius:8px;background:var(--surface);border:1px solid var(--line);transition:all .35s cubic-bezier(.3,1.3,.5,1)}
.statrow{display:flex;gap:16px;align-items:center;margin-top:14px;flex-wrap:wrap}
.donut{width:112px;height:112px;position:relative;flex-shrink:0}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .bg{fill:none;stroke:var(--surface2);stroke-width:10}
.donut .fg{fill:none;stroke:var(--ok);stroke-width:10;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.9,.3,1)}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .c b{font-family:var(--f-display);font-size:22px;font-weight:500;line-height:1.1}
.donut .c span{font-size:11px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;flex:1;min-width:180px}
.kpi{background:var(--surface2);border-radius:10px;padding:8px 10px}
.kpi .l{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .l i{width:8px;height:8px;border-radius:2px;display:inline-block}
.kpi b{font-family:var(--f-display);font-size:19px;font-weight:500}
.period{font-size:12px;color:var(--muted);margin-top:10px}

.calhead{display:flex;align-items:center;justify-content:space-between;margin:20px 0 8px}
.calhead b{font-family:var(--f-display);font-weight:500;font-size:15px}
.calhead .hj{font-size:11px;color:var(--muted);display:block}
.navb{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.navb[disabled]{opacity:.3;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.day{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-family:var(--f-display);opacity:0;transform:scale(.6);animation:dayin .45s cubic-bezier(.3,1.4,.5,1) forwards;position:relative;max-width:100%}
@keyframes dayin{to{opacity:1;transform:none}}
.day.present{background:var(--ok-bg);color:var(--ok)}
.day.late{background:var(--warn-bg);color:var(--warn)}
.day.half{background:var(--half-bg);color:var(--half)}
.day.absent,.day.missing{background:var(--bad-bg);color:var(--bad)}
.day.off{background:transparent;color:var(--off);border:1px dashed var(--line)}
.day.future,.day.none{color:var(--muted);opacity:.45}
.day.pending{background:var(--surface2);color:var(--fg)}
.day.today{box-shadow:0 0 0 2px var(--gold)}
.day.today::after{content:"";position:absolute;inset:-5px;border-radius:12px;border:2px solid var(--gold);animation:ripple 2s ease-out infinite}
@keyframes ripple{from{opacity:.8;transform:scale(.9)}to{opacity:0;transform:scale(1.2)}}
.day.sel{outline:2px solid var(--fg);outline-offset:1px}
button.day{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.daydetail{margin-top:10px;background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13px;min-height:44px}
.yearbars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px;align-items:end;height:110px;margin-top:8px}
.yb{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.yb .b{width:100%;max-width:22px;border-radius:5px 5px 2px 2px;background:var(--ok);transform-origin:bottom;transform:scaleY(0);animation:barup .8s cubic-bezier(.2,.9,.3,1) forwards}
.yb .b.mid{background:var(--warn)}.yb .b.low{background:var(--bad)}
.yb .b.empty{background:var(--surface2)}
@keyframes barup{to{transform:scaleY(1)}}
.yb span{font-size:10px;color:var(--muted);white-space:nowrap}
.yb em{font-style:normal;font-size:9px;color:var(--muted)}

/* owner */
.okpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.okpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.okpi .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.okpi b{font-family:var(--f-display);font-size:28px;font-weight:500;display:block;line-height:1.3}
.okpi.g b{color:var(--ok)}.okpi.r b{color:var(--bad)}.okpi.a b{color:var(--warn)}.okpi.i b{color:var(--info)}
.emp{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);width:100%;text-align:right;transition:background .2s;border-radius:8px}
.emp:first-of-type{border-top:0}
.emp:hover{background:var(--surface2)}
.av{width:38px;height:38px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:13px;flex-shrink:0}
.emp .info{flex:1;min-width:0}
.emp .info b{font-weight:500;display:block}
.emp .info span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:11px;padding:3px 9px;border-radius:999px;white-space:nowrap}
.c-present{background:var(--ok-bg);color:var(--ok)}.c-late{background:var(--warn-bg);color:var(--warn)}
.c-missing,.c-absent{background:var(--bad-bg);color:var(--bad)}.c-break{background:var(--info-bg);color:var(--info)}
.c-done,.c-off,.c-pending{background:var(--surface2);color:var(--muted)}.c-half{background:var(--half-bg);color:var(--half)}
.mini{width:54px;flex-shrink:0;text-align:left}
.mini .t{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:3px}
.mini .t div{height:100%;background:var(--ok);transform-origin:right;transform:scaleX(0);transition:transform 1s cubic-bezier(.2,.9,.3,1)}
.mini small{font-size:11px;color:var(--muted)}
.feed{display:flex;flex-direction:column;max-height:430px;overflow:auto}
.ev{display:flex;gap:10px;padding:10px 2px;border-top:1px solid var(--line);align-items:flex-start}
.ev:first-child{border-top:0}
.ev .ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ev .tx{flex:1;min-width:0;font-size:13px}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.9,.3,1)}

/* toasts */
.toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:40;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}

.toast.leave{animation:lift .4s ease forwards}
@keyframes drop{from{opacity:0;transform:translateY(-30px) scale(.94)}}
@keyframes lift{to{opacity:0;transform:translateY(-24px) scale(.96)}}
.toast .ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast .ico svg{animation:wiggle .5s ease 2 .3s}
@keyframes wiggle{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.toast .tx{flex:1;min-width:0;font-size:13px}
.toast .tx small{display:block;font-size:10px;color:var(--muted)}

.i-ok{background:var(--ok-bg);color:var(--ok)}.i-bad{background:var(--bad-bg);color:var(--bad)}.i-warn{background:var(--warn-bg);color:var(--warn)}.i-info{background:var(--info-bg);color:var(--info)}.i-gold{background:var(--gold-soft);color:var(--gold)}

<script>
const S={in:540,b1:720,b2:960,out:1260,grace:15};
const W={in:[510,719],out1:[720,780],in2:[930,1259],out:[1260,1439]};
const FIELDS=['in','out1','in2','out'];
const FL={in:'الحضور',out1:'خروج البريك',in2:'العودة',out:'الانصراف'};
const ACT={in:'تسجيل حضور',out1:'خروج للبريك',in2:'عودة من البريك',out:'تسجيل انصراف'};
const STL={present:'حاضر',late:'متأخر',half:'نصف يوم',absent:'غائب',missing:'لم يسجّل',pending:'بانتظار الحضور',off:'إجازة',future:'',none:'',break:'في البريك',done:'انصرف'};
const I={
 check:"M5 12l5 5L20 7",
 face:"M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 10h.01M15 10h.01M9.5 15a3.5 3.5 0 0 0 5 0",
 finger:"M18.9 7a8 8 0 0 1 1.1 5v1a6 6 0 0 0 .8 3M8 11a4 4 0 0 1 8 0v1a10 10 0 0 0 2 6M12 11v2a14 14 0 0 0 2.5 8M8 15a18 18 0 0 0 1.8 6M4.9 19a22 22 0 0 1-.9-7v-1a8 8 0 0 1 12-6.95",
 bell:"M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3H4a4 4 0 0 0 2-3v-3a7 7 0 0 1 4-6M9 17v1a3 3 0 0 0 6 0v-1",
 clock:"M12 7v5l3 3M3 12a9 9 0 1 0 18 0a9 9 0 0 0-18 0",
 coffee:"M3 10h14v5a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6zM16.75 12a2.5 2.5 0 0 1 0 5M8 3a2.4 2.4 0 0 0-1 2a2.4 2.4 0 0 0 1 2M12 3a2.4 2.4 0 0 0-1 2a2.4 2.4 0 0 0 1 2",
 login:"M15 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-2M21 12H8l3-3M11 15l-3-3",
 logout:"M14 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-2M9 12h12l-3-3M18 15l3-3",
 alert:"M12 9v4M12 16h.01M3 12a9 9 0 1 0 18 0a9 9 0 0 0-18 0",
 userplus:"M8 7a4 4 0 1 0 8 0a4 4 0 0 0-8 0M16 19h6M19 16v6M6 21v-2a4 4 0 0 1 4-4h4",
 x:"M18 6L6 18M6 6l12 12",
 right:"M9 6l6 6-6 6",left:"M15 6l-6 6 6 6",
 camera:"M5 7h1a2 2 0 0 0 2-2a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2M9 13a3 3 0 1 0 6 0a3 3 0 0 0-6 0",
 play:"M7 4v16l13-8z"
};
const ic=(n,s=20,w=1.8)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${I[n]}"/></svg>`;
const MI={face:['face','الوجه'],finger:['finger','البصمة']};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

const nf=new Intl.NumberFormat('ar-SA'),nf2=new Intl.NumberFormat('ar-SA',{minimumIntegerDigits:2});
const ar=n=>nf.format(n);
const tm=m=>{if(m==null)return '—';m=Math.floor(m);const h=Math.floor(m/60),mm=m%60;return ar(h%12||12)+':'+nf2.format(mm)+' '+(h<12?'ص':'م')};
const dur=m=>{m=Math.max(0,Math.round(m));const h=Math.floor(m/60),x=m%60;return h?ar(h)+' س '+ar(x)+' د':ar(x)+' د'};
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const gFmt=new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-arab',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const hFmt=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-arab',{day:'numeric',month:'long',year:'numeric'});
const mFmt=new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-arab',{month:'long',year:'numeric'});
const msFmt=new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-arab',{month:'short'});
const hmFmt=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-arab',{month:'long',year:'numeric'});
const dFmt=new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-arab',{weekday:'long',day:'numeric',month:'long'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join(' ');

function h32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const SAMPLE=[
 {id:'e0',name:'موظف تجريبي',start:'2026-01-01',abs:.04,late:.08},
 {id:'e1',name:'أحمد محمد',start:'2026-01-01',abs:.03,late:.06},
 {id:'e2',name:'سارة علي',start:'2026-01-01',abs:.02,late:.04},
 {id:'e3',name:'خالد عمر',start:'2026-01-01',abs:.09,late:.14},
 {id:'e4',name:'سعيد حسن',start:'2026-01-01',abs:.05,late:.2},
 {id:'e5',name:'منى يوسف',start:'2026-01-01',abs:.02,late:.03}
];
const LS='asas-basma-v1';
let store={emps:[],rec:{},events:[],sel:'e0'};
try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(s&&s.rec)store=Object.assign(store,s)}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){}}
const emps=()=>SAMPLE.concat(store.emps);
const empById=id=>emps().find(e=>e.id===id)||SAMPLE[0];

const gcache=new Map();
function gen(emp,key){
  if(emp.added) return null;
  const ck=emp.id+key;if(gcache.has(ck)&&key!==keyOf(today0()))return gcache.get(ck);
  const d=fromKey(key),t=today0();let rec=null;
  if(d.getDay()!==5&&key>=emp.start&&d<=t){
    const isT=+d===+t;
    if(!(isT&&(emp.id==='e0'||emp.id==='e3'))){
      const r=rng(h32(ck));
      if(r()>=emp.abs){
        rec={};
        rec.in=r()<emp.late?556+Math.floor(r()*40):528+Math.floor(r()*26);
        if(isT&&emp.id==='e4')rec.in=585;
        const half=r()<.02;
        rec.out1=720+Math.floor(r()*7);
        if(!half){rec.in2=r()<emp.late*.6?977+Math.floor(r()*25):950+Math.floor(r()*14);rec.out=1260+Math.floor(r()*18)}
        rec.m={in:r()<.6?'face':'finger',out1:'finger',in2:r()<.5?'face':'finger',out:'finger'};
        if(isT){const n=nowMin();for(const f of FIELDS)if(rec[f]!=null&&rec[f]>n)delete rec[f];if(rec.in==null)rec=null}
      }
    }
  }
  gcache.set(ck,rec);return rec;
}
function getRec(emp,key){const o=store.rec[emp.id]&&store.rec[emp.id][key];return o!==undefined?o:gen(emp,key)}
function isToday(key){return key===keyOf(today0())}

function status(emp,key){
  const d=fromKey(key),t=today0();
  if(key<emp.start)return 'none';
  if(d>t)return 'future';
  if(d.getDay()===5)return 'off';
  const r=getRec(emp,key),isT=isToday(key),n=nowMin();
  if(!r||r.in==null){if(isT)return n>S.in+S.grace?'missing':'pending';return 'absent'}
  const late=r.in>S.in+S.grace||(r.in2!=null&&r.in2>S.b2+S.grace);
  if(!isT&&r.in2==null)return 'half';
  return late?'late':'present';
}
function liveStatus(emp){
  const key=keyOf(today0()),st=status(emp,key);
  if(st==='off'||st==='missing'||st==='pending')return st;
  const r=getRec(emp,key);
  if(r.out!=null)return 'done';
  if(r.out1!=null&&r.in2==null)return 'break';
  return st;
}
function worked(r,key){
  if(!r||r.in==null)return 0;const isT=isToday(key),n=nowMin();
  const a=(r.out1!=null?r.out1:(isT?Math.min(n,S.b1):S.b1))-r.in;
  let b=0;if(r.in2!=null)b=(r.out!=null?r.out:(isT?Math.min(n,S.out):S.out))-r.in2;
  return Math.max(0,a)+Math.max(0,b);
}
function nextField(r){if(!r)return 'in';for(const f of FIELDS)if(r[f]==null)return f;return null}
function nextTxt(r,n){for(const f of FIELDS){if(W[f][0]>n&&!(r&&r[f]!=null))return FL[f]+' يفتح الساعة '+tm(W[f][0])}return ''}
function allowed(r,n){
  n=Math.floor(n);const nx=nextTxt(r,n);
  for(const f of FIELDS){
    if(n<W[f][0]||n>W[f][1])continue;
    if(r&&r[f]!=null)return {f:null,msg:'تم '+FL[f]+' الساعة '+tm(r[f]),sub:'لا يمكن تسجيل '+FL[f]+' مرة أخرى'+(nx?' · '+nx:'')};
    if(f==='out1'&&!(r&&r.in!=null))return {f:null,msg:'لا يوجد حضور مسجّل اليوم',sub:'خروج البريك يحتاج حضوراً مسجّلاً'+(nx?' · '+nx:'')};
    if(f==='out'&&!(r&&(r.in!=null||r.in2!=null)))return {f:null,msg:'لا يوجد حضور مسجّل اليوم',sub:'لا يمكن الانصراف بدون حضور'};
    return {f};
  }
  return {f:null,msg:'التسجيل مغلق الآن',sub:nx||'انتهت أوقات التسجيل لليوم'};
}
function stats(emp,from,to){
  const t=today0(),end=to<t?to:t;const o={att:0,abs:0,late:0,half:0,hrs:0,days:0};
  for(let d=new Date(from);d<=end;d=addDays(d,1)){
    const k=keyOf(d),s=status(emp,k);
    if(s==='present'||s==='late'||s==='half'){o.att++;o.hrs+=worked(getRec(emp,k),k)}
    if(s==='late')o.late++;if(s==='half')o.half++;
    if(s==='absent'||s==='missing')o.abs++;
    if(['present','late','half','absent','missing'].includes(s))o.days++;
  }
  o.pct=o.days?Math.round(o.att/o.days*100):0;o.hrs=Math.round(o.hrs/60);return o;
}
function periodRange(p){
  const t=today0();
  if(p==='week'){const s=addDays(t,-t.getDay());return [s,addDays(s,6),'الأسبوع الحالي · من '+dFmt.format(s)]}
  if(p==='month'){return [new Date(t.getFullYear(),t.getMonth(),1),new Date(t.getFullYear(),t.getMonth()+1,0),mFmt.format(t)+' · '+hmFmt.format(t)]}
  return [new Date(t.getFullYear(),0,1),new Date(t.getFullYear(),11,31),'سنة '+ar(t.getFullYear()).replace(/٬/g,'')+' حتى اليوم']
}

/* animation helpers */
function countTo(el,to,fmt=ar,dur0=900){
  if(!el)return;const from=+(el.dataset.v||0);el.dataset.v=to;
  if(RM){el.textContent=fmt(to);return}
  const s=performance.now();
  (function f(t){const k=Math.min((t-s)/dur0,1),e=1-Math.pow(1-k,3);el.textContent=fmt(Math.round(from+(to-from)*e));if(k<1)requestAnimationFrame(f)})(s);
}
function movePill(seg){const p=seg.querySelector('.pill'),b=seg.querySelector('[aria-pressed="true"]');if(!p||!b)return;p.style.width=b.offsetWidth+'px';p.style.left=b.offsetLeft+'px'}
function vibrate(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* toasts + feed */
function toast(kind,title,body,who){
  const box=document.getElementById('toasts');const el=document.createElement('div');el.className='toast';
  const icn={ok:'check',bad:'alert',warn:'bell',info:'coffee',gold:'bell'}[kind]||'bell';
  el.innerHTML=`<div class="ico i-${kind}">${ic(icn,18)}</div><div class="tx"><small>أساس العارض · ${esc(who||'الآن')}</small><b>${esc(title)}</b>${body?esc(body):''}</div>`;
  box.prepend(el);vibrate(kind==='bad'?[60,40,60]:40);
  while(box.children.length>3)box.lastChild.remove();
  setTimeout(()=>{el.classList.add('leave');setTimeout(()=>el.remove(),400)},5200);
}
function pushEvent(e){store.events.unshift(Object.assign({at:Date.now(),day:keyOf(today0())},e));store.events=store.events.slice(0,60);save();if(role==='own')renderFeed(true)}

/* clock */
function tickClock(){
  const d=new Date();
  document.getElementById('bigClock').textContent=d.toLocaleTimeString('ar-SA',{hour:'numeric',minute:'2-digit',second:'2-digit'});
}
function setDates(){const d=new Date();document.getElementById('gDate').textContent=gFmt.format(d);document.getElementById('hDate').textContent=hFmt.format(d)+' هـ'}

/* shift band */
function bandHTML(){
  const pos=v=>((v-S.in)/(S.out-S.in)*100);
  return `<div class="band"><div class="now" data-now><span></span></div>
   <div class="bar"><div class="w1" style="flex:3">الفترة الأولى</div><div class="bk" style="flex:4">${ic('coffee',14)} بريك</div><div class="w2" style="flex:5">الفترة الثانية</div></div>
   <div class="ticks"><span style="right:0;transform:none">${tm(S.in)}</span><span style="right:${pos(S.b1)}%">${tm(S.b1)}</span><span style="right:${pos(S.b2)}%">${tm(S.b2)}</span><span style="right:auto;left:0;transform:none">${tm(S.out)}</span></div></div>`;
}
function updateBands(){
  const n=nowMin(),p=Math.min(Math.max((n-S.in)/(S.out-S.in),0),1)*100;
  document.querySelectorAll('[data-now]').forEach(el=>{el.style.right=p+'%';el.querySelector('span').textContent='الآن '+tm(n)});
}

/* profile (stats + calendar + year) */
function mountProfile(root,emp){

function todayRec(emp){return getRec(emp,keyOf(today0()))}
function updateEmpLive(full){
  const emp=empById(store.sel),r=todayRec(emp),n=nowMin(),key=keyOf(today0());
  const hr=new Date().getHours();
  const g=document.getElementById('greet');if(!g)return;
  g.textContent=(hr<12?'صباح الخير':'مساء الخير')+'، '+emp.name.split(' ')[0];
  const nf0=nextField(r),off=fromKey(key).getDay()===5;
  let txt,col;
  const left=x=>dur(x-n);
  if(off){txt='اليوم إجازة أسبوعية';col='var(--muted)'}
  else if(!r||r.in==null){if(n<S.in){txt='الدوام يبدأ بعد '+left(S.in);col='var(--muted)'}else{txt='متأخر عن الحضور منذ '+dur(n-S.in);col='var(--bad)'}}
  else if(r.out1==null){txt='أنت في الفترة الأولى · البريك بعد '+left(S.b1);col='var(--ok)';if(n>=S.b1){txt='حان وقت البريك';col='var(--warn)'}}
  else if(r.in2==null){if(n<S.b2){txt='أنت في البريك · العودة بعد '+left(S.b2);col='var(--info)'}else{txt='متأخر عن العودة منذ '+dur(n-S.b2);col='var(--bad)'}}
  else if(r.out==null){txt=n<S.out?'الفترة الثانية · الانصراف بعد '+left(S.out):'انتهى وقت الدوام · سجّل انصرافك';col=n<S.out?'var(--ok)':'var(--warn)'}
  else{txt='انتهى دوامك · صافي '+dur(worked(r,key));col='var(--gold)'}
  const ph=document.getElementById('phase');ph.style.color=col;ph.innerHTML=`<span class="dot"></span><span>${txt}</span>`;
  if(full){
    const A=off?{f:null}:allowed(r,n),all=!nf0;
    document.getElementById('nextLbl').textContent=off?'لا يوجد دوام اليوم':all?'اكتمل تسجيل اليوم':A.f?ACT[A.f]:A.msg;
    document.getElementById('hint').textContent=off?'':all?'تم تسجيل البصمات الأربع':A.f?ACT[A.f]+' متاح حتى '+tm(W[A.f][1]):A.sub;
    ['bFace','bFp'].forEach(id=>document.getElementById(id).disabled=!A.f);
    const sc=document.getElementById('scan');if(!busy)sc.classList.toggle('locked',!A.f);
    document.getElementById('slots').innerHTML=FIELDS.map(f=>{
      const v=r&&r[f]!=null;const late=v&&((f==='in'&&r.in>S.in+S.grace)||(f==='in2'&&r.in2>S.b2+S.grace));
      const missed=!v&&!off&&n>W[f][1];
      const m=v&&r.m&&r.m[f]?MI[r.m[f]]:null;
      const cls=v?(late?'late':'done'):missed?'missed':(f===A.f?'next':'');
      return `<div class="slot ${cls}" data-slot="${f}"><div class="l">${FL[f]}</div><div class="v num">${v?tm(r[f]):missed?'فات':'—'}</div><div class="m">${m?ic(m[0],11)+m[1]:v?'':'من '+tm(W[f][0])}</div></div>`}).join('');
  }
  const wtEl=document.getElementById('wt');
  if(wtEl){let s=worked(r,key)*60;s=Math.max(0,Math.floor(s));wtEl.textContent=nf2.format(Math.floor(s/3600))+':'+nf2.format(Math.floor(s%3600/60))+':'+nf2.format(s%60)}
}
function bindScan(){
  const bFace=document.getElementById('bFace'),bFp=document.getElementById('bFp'),cam=document.getElementById('cam');
  bFace.onclick=()=>{if(busy)return;const A=allowed(todayRec(empById(store.sel)),nowMin());if(!A.f){runFail(A.msg);updateEmpLive(true);return}cam.value='';cam.click()};
  cam.onchange=async()=>{
    const f=cam.files&&cam.files[0];if(!f)return;
    let thumb=null;
    try{
      const url=URL.createObjectURL(f);const img=new Image();img.src=url;await img.decode();
      const c=document.createElement('canvas'),s=160;c.width=c.height=s;const x=c.getContext('2d');
      const k=Math.max(s/img.width,s/img.height),w=img.width*k,h=img.height*k;x.drawImage(img,(s-w)/2,(s-h)/2,w,h);
      thumb=c.toDataURL('image/jpeg',.72);URL.revokeObjectURL(url);
    }catch(e){runFail('تعذّر قراءة الصورة، حاول مرة أخرى');return}
    document.getElementById('core').innerHTML=`<img src="${thumb}" alt="">`;
    runScan('face',2200,thumb);
  };
  let hold=null;
  const start=e=>{if(window.__bio||busy||bFp.disabled)return;e.preventDefault();bFp.classList.add('holding');vibrate(15);
    document.getElementById('hint').textContent='استمر في الضغط…';
    const scan=document.getElementById('scan');scan.classList.add('busy');
    const t0=performance.now();const prog=document.getElementById('prog');
    (function f(t){if(!bFp.classList.contains('holding'))return;const k=Math.min((t-t0)/1200,1);prog.style.strokeDashoffset=100-k*100;if(k<1)hold=requestAnimationFrame(f);else{bFp.classList.remove('holding');success('finger',null)}})(t0);
  };
  const stop=()=>{if(!bFp.classList.contains('holding'))return;bFp.classList.remove('holding');cancelAnimationFrame(hold);runFail('ارفع إصبعك بعد اكتمال الدائرة')};
  bFp.onclick=async()=>{
    if(!window.__bio||busy||bFp.disabled)return;
    const A=allowed(todayRec(empById(store.sel)),nowMin());if(!A.f){runFail(A.msg);return}
    busy=true;document.getElementById('scan').classList.add('busy');
    document.getElementById('hint').textContent='ضع إصبعك على حساس الجوال أو استخدم Face ID…';
    const ok=await bioVerify(empById(store.sel));busy=false;
    if(ok)runScan('finger',600,null);else{document.getElementById('scan').classList.remove('busy');runFail('لم يتم التحقق من البصمة')}
  };
  bFp.addEventListener('pointerdown',start);
  ['pointerup','pointerleave','pointercancel'].forEach(t=>bFp.addEventListener(t,stop));
  bFp.addEventListener('keydown',e=>{if(window.__bio)return;if((e.key==='Enter'||e.key===' ')&&!e.repeat){busy||runScan('finger',1200,null)}});
}
function runScan(method,ms,thumb){
  busy=true;const scan=document.getElementById('scan'),prog=document.getElementById('prog');
  scan.classList.remove('ok','fail');scan.classList.add('busy');
  document.getElementById('hint').textContent=method==='face'?'جارٍ التحقق من الوجه…':'جارٍ قراءة البصمة…';
  const t0=performance.now();
  (function f(t){const k=Math.min((t-t0)/ms,1);prog.style.strokeDashoffset=100-k*100;if(k<1)requestAnimationFrame(f);else success(method,thumb)})(t0);
}
function runFail(msg){
  const scan=document.getElementById('scan');scan.classList.remove('busy');scan.classList.add('fail');vibrate([60,40,60]);
  document.getElementById('hint').textContent=msg;
  setTimeout(()=>{scan.classList.remove('fail');document.getElementById('prog').style.strokeDashoffset=100;busy=false},700);
}
function success(method,thumb){
  const emp=empById(store.sel),key=keyOf(today0());
  const base=getRec(emp,key);const r=base?JSON.parse(JSON.stringify(base)):{};r.m=r.m||{};
  const A=allowed(base,nowMin());
  if(!A.f){const sc=document.getElementById('scan');sc.classList.remove('busy');busy=false;runFail(A.msg);setTimeout(()=>updateEmpLive(true),750);return}
  const f=A.f;
  const n=Math.floor(nowMin());r[f]=n;r.m[f]=method;if(thumb)r.selfie=thumb;
  (store.rec[emp.id]=store.rec[emp.id]||{})[key]=r;save();
  const scan=document.getElementById('scan');scan.classList.remove('busy');scan.classList.add('ok');vibrate([30,50,90]);
  const late=(f==='in'&&n>S.in+S.grace)||(f==='in2'&&n>S.b2+S.grace);
  const early=f==='out'&&n<S.out;
  document.getElementById('hint').textContent=`تم ${FL[f]} ${tm(n)}`+(late?' · تأخير '+dur(n-(f==='in'?S.in:S.b2)):'')+(early?' · انصراف مبكر':'');
  pushEvent({emp:emp.id,f,t:n,method,late,early});
  toast(late?'warn':'ok',`${emp.name} · ${FL[f]} ${tm(n)}`,`تم التحقق ب${MI[method][1]}`+(late?' · متأخر':''),'إشعار للمالك');
  setTimeout(()=>{
    scan.classList.remove('ok');document.getElementById('prog').style.strokeDashoffset=100;
    document.getElementById('core').innerHTML=`<span class="face">${ic('face',70,1.2)}</span>`;
    busy=false;updateEmpLive(true);
    const sl=document.querySelector(`[data-slot="${f}"]`);sl&&sl.classList.add('flash');
    const pr=document.getElementById('myProf');pr&&pr._refresh&&pr._refresh();
  },1700);
}

function ownerEvents(){
  const key=keyOf(today0()),n=nowMin(),list=[];
  emps().forEach(e=>{
    const r=getRec(e,key);
    const ov=store.rec[e.id]&&store.rec[e.id][key];
    if(r&&!ov)FIELDS.forEach(f=>{if(r[f]!=null){const late=(f==='in'&&r.in>S.in+S.grace)||(f==='in2'&&r.in2>S.b2+S.grace);list.push({emp:e.id,f,t:r[f],method:r.m&&r.m[f],late,gen:true})}});
    if(fromKey(key).getDay()!==5&&(!r||r.in==null)&&n>S.in+S.grace)list.push({emp:e.id,miss:'in',t:S.in+S.grace,gen:true});

  store.events.filter(x=>x.day===key).forEach(x=>list.push(x));

      const s=ls[i],r=getRec(e,key),o=stats(e,ma,mb);
      const line=r&&r.in!=null?FIELDS.filter(f=>r[f]!=null).map(f=>FL[f]+' '+tm(r[f])).join(' · '):(s==='off'?'إجازة أسبوعية':'لا توجد بصمة اليوم');
      return `<button class="emp" data-emp="${e.id}"><div class="av">${esc(initials(e.name))}</div><div class="info"><b>${esc(e.name)}</b><span>${line}</span></div><span class="chip c-${s}">${STL[s]}</span><div class="mini"><small class="num">${o.days?ar(o.pct)+'٪':'—'}</small><div class="t"><div data-w="${o.pct}" style="background:${o.pct>=90?'var(--ok)':o.pct>=75?'var(--warn)':'var(--bad)'}"></div></div></div></button>`}).join('')}</div>
    <form class="form" id="addForm" style="margin-top:14px" novalidate>
     <input id="newName" placeholder="اسم الموظف الجديد" autocomplete="off" aria-label="اسم الموظف الجديد">
     <button class="btn ghost" type="submit" style="flex:0 0 auto">${ic('userplus',16)} إضافة</button>
     <div class="err" id="addErr"></div>
    </form>
   </section>
   <section class="card reveal" style="animation-delay:.16s">
    <h2>الإشعارات <span style="color:var(--gold)">${ic('bell',18)}</span></h2>
    <div class="feed" id="feed"></div>
    <div class="row-btns"><button class="btn ghost" id="demoAlerts">${ic('play',14)} عرض تسلسل التنبيهات</button></div>
   </section>
  </div>
  <section class="card reveal" style="margin-top:16px;animation-delay:.2s">
   <h2>إعدادات الدوام</h2>
   <div class="rules">
    <div>الحضور<b>${tm(S.in)}</b></div><div>بداية البريك<b>${tm(S.b1)}</b></div><div>العودة<b>${tm(S.b2)}</b></div><div>الانصراف<b>${tm(S.out)}</b></div>
    <div>نافذة الحضور<b>${tm(W.in[0])} – ${tm(W.in[1])}</b></div><div>نافذة البريك<b>${tm(W.out1[0])} – ${tm(W.out1[1])}</b></div><div>نافذة العودة<b>${tm(W.in2[0])} – ${tm(W.in2[1])}</b></div><div>نافذة الانصراف<b>${tm(W.out[0])} – ${tm(W.out[1])}</b></div>
    <div>فترة السماح<b>${ar(S.grace)} دقيقة</b></div><div>تذكير الموظف<b>بعد ${ar(5)} و${ar(10)} د</b></div><div>إشعار المالك<b>بعد ${ar(15)} د</b></div><div>الإجازة الأسبوعية<b>الجمعة</b></div>
   </div>
  </section>`;
  v.querySelectorAll('[data-c]').forEach(b=>countTo(b,+b.dataset.c));
  requestAnimationFrame(()=>requestAnimationFrame(()=>v.querySelectorAll('[data-w]').forEach(d=>d.style.transform=`scaleX(${d.dataset.w/100})`)));
  renderFeed(false);updateBands();
  v.querySelector('#empList').onclick=e=>{const b=e.target.closest('[data-emp]');if(b)openSheet(empById(b.dataset.emp))};
  const nm=v.querySelector('#newName'),er=v.querySelector('#addErr');
  nm.oninput=()=>er.textContent='';
  v.querySelector('#addForm').onsubmit=e=>{e.preventDefault();const name=nm.value.trim();
    if(name.length<2){er.textContent='اكتب اسم الموظف أولاً';return}
    if(emps().some(x=>x.name===name)){er.textContent='هذا الاسم موجود بالفعل';return}
    store.emps.push({id:'u'+Date.now(),name,start:keyOf(today0()),abs:0,late:0,added:true});save();
    toast('ok','تمت إضافة '+name,'يظهر الآن في قائمة "تسجيل الدخول كـ"','الإدارة');renderOwner()};
  v.querySelector('#demoAlerts').onclick=demoSequence;
}
function demoSequence(){
  const btn=document.getElementById('demoAlerts');if(btn)btn.disabled=true;
  const seq=[
   {d:0,kind:'warn',icon:'finger',title:'لم تسجّل حضورك بعد',sub:'تذكير للموظف · خالد عمر',t:S.in+5,body:'الدوام بدأ '+tm(S.in)+' · سجّل الآن قبل احتساب التأخير',who:'تنبيه للموظف'},
   {d:1700,kind:'bad',icon:'alert',title:'تذكير أخير',sub:'تذكير للموظف · خالد عمر',t:S.in+10,body:'باقي ٥ دقائق على نهاية فترة السماح',who:'تنبيه للموظف'},
   {d:3400,kind:'bad',icon:'alert',title:'خالد عمر لم يسجّل حضور',sub:'إشعار للمالك بعد تذكيرين',t:S.in+15,body:'لم يستجب لتذكيرين',who:'إشعار للمالك'}
  ];
  seq.forEach(s=>setTimeout(()=>{toast(s.kind,s.title,s.body,s.who);
    const feed=document.getElementById('feed');if(feed){const tmp=document.createElement('div');tmp.innerHTML=evHTML({demo:true,...s},true);feed.prepend(tmp.firstChild)}
  },s.d));
  setTimeout(()=>{if(btn)btn.disabled=false},4200);
}

/* sheet */
function openSheet(emp){
  const sh=document.getElementById('sheet'),sc=document.getElementById('scrim'),inner=document.getElementById('sheetInner');
  const r=getRec(emp,keyOf(today0()));
  inner.innerHTML=`<div class="sh-head"><div class="av">${r&&r.selfie?`<img src="${r.selfie}" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:esc(initials(emp.name))}</div><b>${esc(emp.name)}</b>
    <button class="navb" id="shClose" aria-label="إغلاق">${ic('x',16)}</button></div>
    ${r&&r.selfie?'<p class="muted small" style="margin:-6px 0 12px">صورة التحقق من آخر بصمة وجه اليوم</p>':''}
    <div class="card" style="padding:16px"><div id="shProf"></div></div>`;
  sh.hidden=false;sc.hidden=false;
  requestAnimationFrame(()=>{sh.classList.add('on');sc.classList.add('on')});
  mountProfile(document.getElementById('shProf'),emp);
  document.getElementById('shClose').onclick=closeSheet;sc.onclick=closeSheet;
  document.getElementById('shClose').focus();
}
function closeSheet(){
  const sh=document.getElementById('sheet'),sc=document.getElementById('scrim');
  sh.classList.remove('on');sc.classList.remove('on');setTimeout(()=>{sh.hidden=true;sc.hidden=true},450);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('sheet').hidden)closeSheet()});

/* role switch */
function setRole(r){
  role=r;const seg=document.getElementById('roleSeg');
  document.getElementById('r-emp').setAttribute('aria-pressed',r==='emp');document.getElementById('r-own').setAttribute('aria-pressed',r==='own');
  movePill(seg);
  const ve=document.getElementById('vEmp'),vo=document.getElementById('vOwn');
  ve.hidden=r!=='emp';vo.hidden=r!=='own';
  if(r==='emp')renderEmp();else renderOwner();
}
document.getElementById('r-emp').onclick=()=>setRole('emp');
document.getElementById('r-own').onclick=()=>setRole('own');
addEventListener('resize',()=>document.querySelectorAll('.seg,.tabs').forEach(movePill));

/* reminder engine (live, for the selected employee) */
const fired=new Set();
function checkReminders(){
  const key=keyOf(today0());if(fromKey(key).getDay()===5)return;
  const n=nowMin(),emp=empById(store.sel),r=todayRec(emp);
  const rule=(id,cond,fn)=>{const k=key+emp.id+id;if(cond&&!fired.has(k)){fired.add(k);fn()}};
  const noIn=!r||r.in==null,noBack=r&&r.out1!=null&&r.in2==null;
  rule('in5',noIn&&n>=S.in+5&&n<S.in+10,()=>toast('warn','لم تسجّل حضورك بعد','الدوام بدأ '+tm(S.in)+' · سجّل الآن قبل احتساب التأخير','تنبيه لك'));
  rule('in10',noIn&&n>=S.in+10&&n<S.in+15,()=>toast('bad','تذكير أخير','باقي ٥ دقائق على نهاية فترة السماح','تنبيه لك'));
  rule('b-5',r&&r.out1!=null&&noBack&&n>=S.b2-5&&n<S.b2,()=>toast('info','العودة من البريك بعد ٥ دقائق','لا تنسَ تسجيل بصمة العودة','تنبيه لك'));
  rule('b5',noBack&&n>=S.b2+5&&n<S.b2+15,()=>toast('warn','لم تسجّل عودتك من البريك','سجّل الآن قبل احتساب التأخير','تنبيه لك'));
}

/* device biometrics (WebAuthn) */
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function bioVerify(emp){
  try{
    store.cred=store.cred||{};const ch=crypto.getRandomValues(new Uint8Array(32));
    if(!store.cred[emp.id]){
      const c=await navigator.credentials.create({publicKey:{challenge:ch,rp:{name:'أساس العارض'},
        user:{id:new TextEncoder().encode(emp.id),name:emp.id,displayName:emp.name},
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});
      store.cred[emp.id]=b64(c.rawId);save();toast('ok','تم ربط بصمتك بهذا الجهاز','البصمة القادمة ستُطابق عليها','الأمان');return true;
    }
    await navigator.credentials.get({publicKey:{challenge:ch,allowCredentials:[{type:'public-key',id:unb64(store.cred[emp.id])}],userVerification:'required',timeout:60000}});
    return true;
  }catch(e){return false}
}
(async()=>{try{if(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()){window.__bio=true;if(role==='emp'&&!busy)renderEmp()}}catch(e){}})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* boot */
setDates();tickClock();
setInterval(()=>{tickClock();if(role==='emp')updateEmpLive(false)},1000);
setInterval(()=>{updateBands();checkReminders();if(role==='emp'&&!busy)updateEmpLive(true)},20000);
renderEmp();movePill(document.getElementById('roleSeg'));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>document.querySelectorAll('.seg,.tabs').forEach(movePill));
setTimeout(()=>{const s=document.getElementById('splash');s.classList.add('out');setTimeout(()=>s.remove(),700);checkReminders()},RM?200:2700);
</script>
